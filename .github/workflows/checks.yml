name: Required server checks
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      manifest_sha256:
        value: ${{ jobs.images.outputs.manifest_sha256 }}
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/ci/install-tools.mjs gitleaks actionlint
      - run: actionlint -shellcheck=""
      - run: node scripts/ci/audit-source.mjs
      - name: Scan complete checked-out history without printing secrets
        run: gitleaks git . --log-opts=--all --redact=100 --no-banner
      - name: Scan exact publication tree
        run: gitleaks dir .local/publication-tree --redact=100 --no-banner

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run check
      - run: npm run test:tools
      - run: npm run test:ci
      - run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    outputs:
      manifest_sha256: ${{ steps.export.outputs.manifest_sha256 }}
    env:
      ULDA_TEST_IMAGE: ulda-ci/server:candidate
      ULDA_TEST_POSTGRES_IMAGE: ulda-ci/postgres:candidate
      ULDA_TEST_PROXY_IMAGE: ulda-ci/proxy:candidate
      ULDA_LOAD_CLIENTS: '100'
      ULDA_LOAD_WORKERS: '4'
      ULDA_LOAD_SECONDS: ${{ inputs.release && '1800' || '30' }}
      ULDA_LOAD_WARMUP: '10'
      ULDA_LOAD_PROFILE: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release identity
        if: inputs.release
        run: node scripts/ci/release.mjs identity
      - run: npm ci --ignore-scripts --no-fund
      - run: npm ci --prefix test/consumer --ignore-scripts --no-fund
      - run: npm audit --prefix test/consumer --omit=dev --audit-level=high
      - name: Read reviewed SDK candidate identity
        id: sdk
        run: node scripts/ci/sdk-candidate.mjs identity
      - name: Check out exact SDK candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ulda-io/ulda-auth
          ref: ${{ steps.sdk.outputs.commit }}
          path: .local/sdk-source
          persist-credentials: false
      - name: Build candidate and verify reviewed npm archive digest
        run: npm run ci:sdk-candidate
      - name: Build application and separate Linux amd64 test fixtures
        run: node scripts/ci/images.mjs build
      - name: Published SDK, real PostgreSQL and container checks
        run: npm run test:integration
      - name: SDK candidate with 65 public creates and a 10000-content catalog
        run: npm run test:large-catalog
      - name: TLS, privileges, restart and backup restoration
        run: npm run test:deployment
      - name: Application-only Compose with independently operated PostgreSQL
        run: node scripts/ci/release-smoke.mjs --candidate
      - name: Closed-loop load and final persisted-state verification
        run: npm run test:capacity
      - name: Keep numeric capacity diagnostics on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-report-${{ github.sha }}-${{ github.run_attempt }}
          path: .local/ulda-capacity-*/result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Export only the tested application image and acceptance receipt
        id: export
        env:
          ULDA_CI_RELEASE: ${{ inputs.release }}
        run: node scripts/ci/images.mjs export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checked-images-${{ github.sha }}
          path: .local/ci-images/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Install scanner for advisory test-infrastructure inventory
        id: fixture-scanner
        continue-on-error: true
        run: node scripts/ci/install-tools.mjs trivy
      - name: Report database and proxy fixture CVEs (not release artifacts)
        id: fixture-scan
        if: steps.fixture-scanner.outcome == 'success'
        continue-on-error: true
        run: node scripts/ci/images.mjs scan-fixtures
      - name: Surface incomplete advisory inventory
        if: ${{ always() && (steps.fixture-scanner.outcome != 'success' || steps.fixture-scan.outcome != 'success') }}
        run: echo '::warning::Test-infrastructure CVE inventory did not complete. This is not a security approval for PostgreSQL or the proxy.'
      - name: Keep raw test-infrastructure findings separately
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture-reports-${{ github.sha }}
          path: .local/ci-fixture-reports/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  image-security:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checked-images-${{ github.sha }}
          path: .local/ci-images
      - run: node scripts/ci/install-tools.mjs trivy
      - name: Verify application archive and enforce full vulnerability gate
        env:
          ULDA_MANIFEST_SHA256: ${{ needs.images.outputs.manifest_sha256 }}
        run: node scripts/ci/images.mjs scan
      - name: Keep component reports, never database dumps or test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: component-reports-${{ github.sha }}
          path: .local/ci-reports/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Required release gate
    if: ${{ always() }}
    needs: [source, unit, images, image-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every required job must have succeeded
        env:
          SOURCE: ${{ needs.source.result }}
          UNIT: ${{ needs.unit.result }}
          IMAGES: ${{ needs.images.result }}
          SECURITY: ${{ needs.image-security.result }}
        run: |
          test "$SOURCE" = success
          test "$UNIT" = success
          test "$IMAGES" = success
          test "$SECURITY" = success
