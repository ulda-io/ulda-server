worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 2048; }
http {
    # Queries may carry socket IDs; never log request URLs, headers or bodies.
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    limit_conn_zone $binary_remote_addr zone=per_ip:1m;
    limit_req_zone $binary_remote_addr zone=handshake:1m rate=20r/s;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:1m;
        ssl_session_timeout 10m;
        client_header_timeout 10s;
        client_body_timeout 15s;
        send_timeout 30s;
        client_max_body_size 8m;
        large_client_header_buffers 2 8k;
        limit_conn per_ip 20;
        limit_conn_status 429;
        limit_req zone=handshake burst=40 nodelay;
        limit_req_status 429;
        location /socket.io/ {
            set $ulda_backend http://server:3000;
            proxy_pass $ulda_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            # The app does not use proxy headers for authorization.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_next_upstream off;
        }
        # Readiness/health stay internal. No public REST CRUD or probe endpoints.
        location / { return 404; }
    }
}
