# Merge with the root compose.yaml; Compose >= 2.24.4. Supply real TLS files.
services:
  server:
    ports: !reset []
  proxy:
    image: "${ULDA_PROXY_IMAGE:-ulda/proxy:local}"
    build:
      context: ./deploy/proxy
    user: "101:101"
    entrypoint: [nginx]
    command: ["-g", "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 1.0
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    secrets: [tls_cert, tls_key]
    ports:
      - "${ULDA_TLS_PUBLISH_ADDRESS:-127.0.0.1}:${ULDA_TLS_PORT:-443}:8443"
    networks: [edge]
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
secrets:
  tls_cert:
    file: "${ULDA_TLS_CERT_FILE:?Set the certificate chain path}"
  tls_key:
    file: "${ULDA_TLS_KEY_FILE:?Set the TLS private key path}"
